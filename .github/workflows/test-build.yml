# Builds the Windows installer without the updater signature, to try a version
# before releasing it. Run it by hand from the Actions tab; the installer is in
# the run's "windows-installer" artifact (a zip; needs a GitHub login to download).
# Not a release: nothing here is published and it won't update itself.

name: Test build (Windows)

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: dtolnay/rust-toolchain@stable

            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - run: npm ci

            - name: Build the installer
              shell: bash
              run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

            - uses: actions/upload-artifact@v4
              with:
                  name: windows-installer
                  path: src-tauri/target/release/bundle/nsis/*.exe
                  if-no-files-found: error
