[package]
name = "aoe2-civs-overlay"
version = "2.0.0"
description = "Always-on-top Age of Empires II civilization overlay"
authors = ["Maximiliano Redigonda"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "aoe2_civs_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
