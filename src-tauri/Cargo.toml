[package]
name = "aoe2-civs-overlay"
version = "2.0.1"
description = "Always-on-top Age of Empires II civilization overlay"
authors = ["Maximiliano Redigonda"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "aoe2_civs_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Screen capture for reading the game's HUD (Windows and macOS only: on Linux it
# would pull in PipeWire/Wayland libraries the release build doesn't have)
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
xcap = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
